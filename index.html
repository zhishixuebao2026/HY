<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>花园：超限算力战争 · The Garden</title>
<meta name="description" content="改编自「花园」系列设定集的超限层级卡牌对战游戏。从 ℵ₀ 攀升至『花园』，用层级压制与操作后继碾压对手。">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/effects.css">
<link rel="stylesheet" href="css/motion.css">
</head>
<body>

<canvas id="stardust"></canvas>

<div id="app">

  <!-- ==================== 顶栏 ==================== -->
  <div class="topbar">
    <div class="brand">
      <span class="glyph">✿</span>
      <h1>花园：超限算力战争</h1>
      <span class="sub">THE GARDEN</span>
    </div>
    <div class="turn-badge" id="turnBadge" role="status" aria-live="polite"></div>
    <nav class="navtabs" aria-label="主导航">
      <button class="navtab on" data-view="home">首页</button>
      <button class="navtab" data-view="academy"><span class="nt-long">序章 · 学院</span><span class="nt-short">学院</span></button>
      <button class="navtab" data-view="battle">对战</button>
      <button class="navtab" data-view="tower"><span class="nt-long">超限阶梯</span><span class="nt-short">阶梯</span></button>
      <button class="navtab" data-view="codex">图鉴</button>
      <button class="navtab" data-view="rules">规则</button>
      <button class="navtab" data-view="builder">组牌</button>
    </nav>
  </div>

  <!-- ==================== 首页 ==================== -->
  <div class="view on view-home" id="viewHome">
    <div id="homeBody"></div>
  </div>

  <!-- ==================== 对战 ==================== -->
  <div class="view" id="viewBattle">
    <div class="arena">
      <div class="arena-main">

        <!-- 对手状态 -->
        <div class="pstat foe" id="pstatFoe" role="button" tabindex="0" data-keyboard-control="true" aria-label="敌方状态，选择为攻击目标"></div>

        <div class="board-wrap">
          <!-- 对手战场 -->
          <div class="board foe" id="boardFoe"></div>

          <!-- 后继天平 -->
          <div id="successorBeam">
            <div class="beam">
              <div class="beam-title">后 继 差 · 任 一 方 达 到 12 即 碾 压 获 胜</div>
              <div class="beam-scale">
                <span class="beam-cap l" id="beamCapL">0</span>
                <span class="beam-lbl l">我</span>
                <div class="beam-track">
                  <div class="beam-ticks"></div>
                  <div class="beam-side l" id="beamL"></div>
                  <div class="beam-side r" id="beamR"></div>
                  <div class="beam-zero"></div>
                </div>
                <span class="beam-lbl r">敌</span>
                <span class="beam-cap r" id="beamCapR">0</span>
              </div>
            </div>
          </div>

          <!-- 我方战场 -->
          <div class="board mine" id="boardMine"></div>
        </div>

        <!-- 我方状态 -->
        <div class="pstat mine" id="pstatMine" role="button" tabindex="0" data-keyboard-control="true" aria-label="我方状态，查看存在度与资源"></div>

        <!-- 手牌 -->
        <div class="hand-dock">
          <div class="hand" id="hand"></div>
        </div>

        <!-- 操作区 -->
        <div class="action-dock" id="actionDock"></div>
      </div>

      <!-- 侧栏日志 -->
      <aside class="sidebar">
        <div class="side-head">
          <span>战 斗 记 录</span>
          <span style="font-size:9px;color:var(--txt-mut)">Ψ 算力</span>
        </div>
        <div class="log-list" id="logList"></div>
        <div class="side-foot">
          <button class="btn sm" onclick="openRulesQuick()">规则速查</button>
          <button class="btn sm" onclick="showKeywordHelp()">关键词</button>
        </div>
      </aside>
    </div>
  </div>

  <!-- ==================== 序章 · 超限学院 ==================== -->
  <div class="view view-tower" id="viewAcademy">
    <div id="academyHead" class="tower-head"></div>
    <div class="tower-path" id="academyPath"></div>
  </div>

  <!-- ==================== 超限阶梯 ==================== -->
  <div class="view view-tower" id="viewTower">
    <div id="towerHead" class="tower-head"></div>
    <div class="tower-path" id="towerPath"></div>
  </div>

  <!-- ==================== 图鉴 ==================== -->
  <div class="view view-codex" id="viewCodex">
    <div class="codex-bar" id="codexBar"></div>
    <div class="codex-grid" id="codexGrid"></div>
  </div>

  <!-- ==================== 规则 ==================== -->
  <div class="view view-codex" id="viewRules">
    <div id="rulebookBody" style="max-width:820px;margin:0 auto;padding-bottom:40px"></div>
  </div>

  <!-- ==================== 组牌 ==================== -->
  <div class="view" id="viewBuilder">
    <div class="builder-banner" id="builderBanner"></div>
    <div class="deck-builder">
      <div class="pool-col">
        <div class="deck-head">
          <div>
            <div class="page-title">卡 池</div>
            <div class="page-desc">点击加入牌组（同卡最多 3 张）· 右键查看详情</div>
          </div>
          <div class="btn-row">
            <button class="btn sm" onclick="Builder.preset('silver')">银之网预设</button>
            <button class="btn sm" onclick="Builder.preset('grammar')">语法宇宙预设</button>
            <button class="btn sm" onclick="Builder.preset('garden')">花园神祇预设</button>
          </div>
        </div>
        <div class="pool-bar" id="builderBar"></div>
        <div class="pool-grid" id="builderPool"></div>
      </div>
      <div class="deck-panel">
        <div class="deck-head">
          <div class="page-title">我 的 牌 组</div>
          <div class="deck-count" id="builderCount">0 / 30</div>
        </div>
        <div class="deck-list" id="builderDeck"></div>
        <div class="deck-stats" id="builderStats"></div>
        <div class="deck-actions">
          <button class="btn sm" onclick="Builder.clear()">清空</button>
          <button class="btn sm" onclick="Builder.save();toast('牌组已保存','good')">保存</button>
          <button class="btn sm primary" onclick="showView('battle');openDeckSelect();">用此牌组对战</button>
        </div>
      </div>
    </div>
  </div>

</div><!-- /#app -->

<!-- 通用容器 -->
<div id="toastBox" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="modalMask" class="modal-mask"></div>
<div id="endOverlay" class="overlay-end">
  <div class="end-box" id="endBox"></div>
</div>

<!-- 脚本 -->
<script src="js/data/cards.js"></script>
<script src="js/core/engine.js"></script>
<script src="js/core/ai.js"></script>
<script src="js/art/procedural.js"></script>
<script src="js/ui/render.js"></script>
<script src="js/ui/battle.js"></script>
<script src="js/ui/codex.js"></script>
<script src="js/core/roguelike.js"></script>
<script src="js/core/academy.js"></script>
<script src="js/ui/motion.js"></script>
<script src="js/ui/coach.js"></script>
<script src="js/main.js"></script>

<script>
/* 侧栏快捷功能 */
function openRulesQuick() {
  const wrap = document.createElement('div');
  RULES.forEach(r => {
    const b = document.createElement('div');
    b.className = 'rule-block';
    b.innerHTML = '<h4>' + r.title + '</h4><p>' + r.body.replace(/【(.+?)】/g, '<b>$1</b>') + '</p>';
    wrap.appendChild(b);
  });
  openModal('规则速查', wrap);
}
function showKeywordHelp() {
  const wrap = document.createElement('div');
  const g = document.createElement('div');
  g.className = 'kw-list';
  Object.keys(KEYWORDS).forEach(k => {
    const i = document.createElement('div');
    i.className = 'kw-item';
    i.innerHTML = '<div class="k">' + k + '</div><div class="d">' + KEYWORDS[k] + '</div>';
    g.appendChild(i);
  });
  wrap.appendChild(g);
  openModal('关键词词典', wrap);
}
</script>

</body>
</html>
